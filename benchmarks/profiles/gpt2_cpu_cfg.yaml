name: gpt2-transformers-cpu-cfg
model: gpt2
backend: transformers
launch:
  transformers-device: cpu
  transformers-dtype: float32
  transformers-torch-threads: 4
  cache: auto
  temperature: 0.0
  seed: 17
  cfg-unconditional-prompt: "A neutral list:"
  cfg-scale: 1.5
scenarios:
  - cfg-lifecycle
repeats: 1
warmup: 0
timeout_s: 90
