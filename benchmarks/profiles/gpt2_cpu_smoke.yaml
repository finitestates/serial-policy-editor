name: gpt2-transformers-cpu-smoke
model: gpt2
backend: transformers
launch:
  transformers-device: cpu
  transformers-dtype: float32
  transformers-torch-threads: 4
  cache: auto
  temperature: 0.0
  seed: 17
scenarios:
  - continuation
  - controlled-write
  - candidate-refresh
  - instrumentation-parity
  - action-jsonl
  - observed-jsonl
  - rewind-replace
  - fork-switch
  - save-resume
  - long-context
  - cache-compare
  - cli-jsonl
repeats: 1
warmup: 1
timeout_s: 90
