name: llama-1b-q4km-cpu-smoke
model: Llama-3.2-1B-Instruct-GGUF/Llama-3.2-1B-Instruct-Q4_K_M.gguf
backend: llama.cpp
launch:
  n-ctx: 256
  n-batch: 64
  n-threads: 4
  n-gpu-layers: 0
  cache: auto
  temperature: 0.0
  seed: 17
  max-tokens: 64
rtol: 0.001
atol: 0.02
scenarios:
  - continuation
  - controlled-write
  - candidate-refresh
  - instrumentation-parity
  - action-jsonl
  - observed-jsonl
  - rewind-replace
  - fork-switch
  - save-resume
  - long-context
  - cache-compare
  - cli-jsonl
repeats: 1
warmup: 1
timeout_s: 90
