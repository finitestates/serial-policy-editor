[package]
name = "rust-terminal-ui-smoke"
version = "0.1.0"
edition = "2024"
description = "Standalone Rust process for the terminal UI PTY smoke experiment"
license = "MIT"

[[bin]]
name = "rust-terminal-ui-smoke"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
