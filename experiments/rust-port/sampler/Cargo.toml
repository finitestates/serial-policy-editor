[package]
name = "rust-sampler"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust port of the policy editor numeric sampler"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake2 = "0.10"
pyo3 = { version = "0.27", features = ["extension-module"] }
serde_json = "1"
