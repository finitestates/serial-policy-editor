[package]
name = "rust-sampler"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust port of the policy editor numeric sampler"
license = "MIT"

[lib]
name = "rust_sampler_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
blake2 = "0.10"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
serde_json = "1"
