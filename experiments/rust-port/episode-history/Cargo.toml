[package]
name = "episode-history"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust port of root-relative episode action history"
license = "MIT"

[lib]
name = "episode_history_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
