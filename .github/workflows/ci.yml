name: Test and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            vector/pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "core[test]" -e ./vector

      - name: Run core tests
        run: python -m pytest -q tests/core

      - name: Run vector tests
        run: python -m pytest -q tests/vectors

      - name: Run reference-kernel parity tests
        run: python -m pytest -q reference-kernel

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist/core ./core
          python -m build --sdist --wheel --outdir dist/vector ./vector
          python -m twine check --strict dist/core/* dist/vector/*

      - name: Install built wheels
        run: python -m pip install dist/core/*.whl dist/vector/*.whl

      - name: Check installed command-line tools
        run: |
          policy-editor --help
          policy-editor-vector --help
