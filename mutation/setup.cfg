[mutmut]
# Run from the generated workspace, where core/src is copied to src/ so
# mutant names match the trajectory_editor imports used by the tests.
source_paths = src
only_mutate =
    src/trajectory_editor/core/sampling.py
    src/trajectory_editor/core/sampler_config.py
    src/trajectory_editor/episode_history.py
    src/trajectory_editor/episode_lineage.py
    src/trajectory_editor/episode_replay_source.py
    src/trajectory_editor/episode_lifecycle.py
    src/trajectory_editor/episode_engine.py
pytest_add_cli_args =
    -c
    mutmut_pytest.ini
pytest_add_cli_args_test_selection = tests/core
also_copy =
    core/src
    mutmut_pytest.ini
