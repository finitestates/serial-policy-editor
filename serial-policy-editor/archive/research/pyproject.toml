[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-editor-research"
version = "0.4.6"
description = "Optional research adapters, learning, instrumentation, and experimental policy tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "policy-editor-core>=0.4.6",
    "numpy>=1.24",
    "PyYAML>=6",
]

[project.scripts]
policy-editor-research = "trajectory_editor.research_cli:main"
policy-editor-bias = "trajectory_editor.bias_cli:main"
policy-editor-research-vector = "trajectory_editor.research_vector_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trajectory_editor*"]
namespaces = true
