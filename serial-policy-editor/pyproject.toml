[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-policy-editor"
version = "0.3.6"
description = "A small terminal editor for human-steered model continuations and serial policy replay"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "prompt-toolkit>=3.0,<4", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
llama = ["llama-cpp-python>=0.3"]
transformers = ["torch>=2.1", "transformers>=4.45,<6"]
transformers-bnb = ["torch>=2.1", "transformers>=4.45,<6", "bitsandbytes>=0.43"]

[project.scripts]
policy-editor = "trajectory_editor.episode_cli:main"
policy-editor-server = "trajectory_editor.headless:main"
policy-editor-bias = "trajectory_editor.bias_cli:main"

[tool.setuptools]
packages = ["trajectory_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llama_smoke: opt-in integration tests using a real local GGUF model",
    "transformers_smoke: opt-in integration tests using a real local Hugging Face model",
     ]

[tool.setuptools.package-data]
trajectory_editor = ["web/*.html", "web/*.css", "web/*.js"]
