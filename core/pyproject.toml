[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-editor-core"
version = "1.0.0"
description = "Core terminal editor for human-steered model continuations and serial policy replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "rich>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pyte>=0.8.2,<1", "hypothesis>=6,<7"]
llama = ["llama-cpp-python>=0.3"]
transformers = ["torch>=2.1", "transformers>=4.45,<6"]
transformers-accelerate = [
    "torch>=2.1",
    "transformers>=4.45,<6",
    "accelerate>=0.26",
]
transformers-gguf = [
    "torch>=2.1",
    "transformers>=4.45,<6",
    "gguf>=0.10",
    "accelerate>=0.26",
]
transformers-bnb = [
    "torch>=2.1",
    "transformers>=4.45,<6",
    "bitsandbytes>=0.43",
    "accelerate>=0.26",
]

[project.scripts]
policy-editor = "trajectory_editor.episode_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["trajectory_editor", "trajectory_editor.core", "trajectory_editor.term"]
