[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-editor-vector"
version = "0.6.0"
description = "Optional activation/steering-vector tools for Serial Policy Editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "policy-editor-core>=0.6.0",
    "numpy>=1.24",
]

[project.scripts]
policy-editor-vector = "trajectory_editor.steering_vector_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trajectory_editor*"]
namespaces = true
